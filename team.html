<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Team — MLB Archive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css" />
<style>
  .hero {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 6px;
  }
  .hero h1 { font-size: clamp(32px, 5vw, 48px); }
  .hero .meta { color: var(--text-muted); font-family: var(--display); font-size: 15px; }
  .lede { color: var(--text-faint); font-size: 15px; margin-bottom: 36px; }

  .grid {
    display: grid;
    grid-template-columns: 1.3fr 1fr;
    gap: 20px;
    margin-bottom: 20px;
  }
  @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }

  .trophy-row { display: flex; justify-content: space-between; align-items: baseline; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .trophy-row:last-child { border-bottom: none; }
  .trophy-row .count { font-family: var(--display); font-size: 22px; color: var(--text); }
  .trophy-row .label { font-size: 14px; color: var(--text-muted); }
  .trophy-years { font-size: 12px; color: var(--text-faint); margin-top: -4px; padding-bottom: 8px; }

  .name-history li { padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 14px; color: var(--text-muted); }
  .name-history li:last-child { border-bottom: none; }
  .name-history .current { color: var(--text); }
  .name-history .through { color: var(--text-faint); font-family: var(--mono); font-size: 12px; }

  .section-head { display: flex; justify-content: space-between; align-items: baseline; margin: 44px 0 14px; }
  .section-head h2 { font-size: 20px; }
  .load-more { background: transparent; border: 1px solid var(--border-strong); color: var(--text-muted); font-family: var(--display); font-size: 12px; padding: 7px 14px; border-radius: 3px; cursor: pointer; }
  .load-more:hover { color: var(--text); border-color: var(--accent-hover); }
  .load-more:disabled { opacity: 0.4; cursor: default; }
</style>
</head>
<body>

<header class="site-header">
  <div class="bar">
    <a class="wordmark" href="index.html">Diamond<span>Archive</span></a>
    <nav>
      <a href="scores.html">Scores</a>
      <a href="standings.html">Standings</a>
      <a href="teams.html">Teams</a>
      <a href="players.html">Players</a>
    </nav>
  </div>
</header>

<main>
  <div class="crumbs"><a class="link" href="teams.html">Teams</a> / <span id="crumb-name">…</span></div>
  <div id="content">
    <div class="state-msg">Loading team…</div>
  </div>
</main>

<script src="data.js"></script>
<script>
  const { fetchCoreFile, fetchYearRange, qs, el } = window.MLB;
  const teamId = qs("id");
  const content = document.getElementById("content");
  const RECENT_YEARS = 15;
  const EARLIEST_YEAR = 1980;
  let currentYear = new Date().getUTCFullYear();

  function pick(obj, keys, fallback) {
    for (const k of keys) if (obj && obj[k] != null) return obj[k];
    return fallback;
  }

  function fail(msg) {
    content.innerHTML = "";
    content.appendChild(el("div", { class: "state-msg error" }, [
      el("div", { text: msg }),
      el("button", { class: "retry", text: "Try again", onclick: "location.reload()" }),
    ]));
  }

  if (!teamId) {
    fail("No team specified. Open this page as team.html?id=<teamId>.");
  } else {
    fetchCoreFile(`teams/${teamId}.json`)
      .then(renderTeam)
      .catch((e) => fail(`Couldn't load this team (${e.message}).`));
  }

  function trophyRow(label, years) {
    years = years || [];
    const row = el("div", { class: "trophy-row" }, [
      el("span", { class: "label", text: label }),
      el("span", { class: "count", text: String(years.length) }),
    ]);
    return row;
  }

  function renderTeam(team) {
    document.getElementById("crumb-name").textContent = team.currentName;
    document.title = `${team.currentName} — MLB Archive`;

    content.innerHTML = "";

    content.appendChild(el("div", { class: "hero" }, [
      el("h1", { text: team.currentName }),
      el("span", { class: "meta", text: [team.division, team.league].filter(Boolean).join(" · ") }),
    ]));
    content.appendChild(el("p", { class: "lede", text: `Franchise record on the field, its past identities, and every year of standings data on file.` }));

    const grid = el("div", { class: "grid" });

    // trophies panel
    const tr = team.trophies || {};
    const trophies = el("div", { class: "panel" }, [
      el("div", { class: "eyebrow", text: "Trophy case" }),
      trophyRow("World Series", tr.worldSeries),
      trophyYears(tr.worldSeries),
      trophyRow("Pennants", tr.pennants),
      trophyYears(tr.pennants),
      trophyRow("Division titles", tr.divisionTitles),
      trophyYears(tr.divisionTitles),
      trophyRow("Wild cards", tr.wildCards),
      trophyYears(tr.wildCards),
    ]);
    grid.appendChild(trophies);

    // name history panel
    const history = (team.nameHistory || []).slice().sort((a, b) => a.throughYear - b.throughYear);
    const list = el("ul", { class: "name-history" });
    history.forEach((h) => {
      list.appendChild(el("li", {}, [
        el("span", { text: h.name }),
        el("span", { class: "through", text: `  through ${h.throughYear}` }),
      ]));
    });
    list.appendChild(el("li", {}, [ el("span", { class: "current", text: team.currentName }), el("span", { class: "through", text: "  present" }) ]));
    grid.appendChild(el("div", { class: "panel" }, [
      el("div", { class: "eyebrow", text: "Franchise names" }),
      list,
    ]));

    content.appendChild(grid);

    // record by year
    content.appendChild(el("div", { class: "section-head" }, [
      el("h2", { text: "Record by year" }),
      el("button", { class: "load-more", id: "load-more", text: `Load ${EARLIEST_YEAR}–${currentYear - RECENT_YEARS}` }),
    ]));
    const tableWrap = el("div", { class: "table-wrap panel" });
    tableWrap.appendChild(el("div", { class: "state-msg", id: "record-status", text: "Loading recent seasons…" }));
    content.appendChild(tableWrap);

    loadRecord(currentYear - RECENT_YEARS + 1, currentYear, tableWrap);

    document.getElementById("load-more").addEventListener("click", (e) => {
      e.target.disabled = true;
      e.target.textContent = "Loading…";
      loadRecord(EARLIEST_YEAR, currentYear - RECENT_YEARS, tableWrap, true).then(() => {
        e.target.remove();
      });
    });
  }

  function trophyYears(years) {
    if (!years || !years.length) return el("div", { class: "trophy-years", text: "—" });
    return el("div", { class: "trophy-years", text: years.slice().sort((a, b) => b - a).join(", ") });
  }

  function loadRecord(fromYear, toYear, tableWrap, prepend) {
    return fetchYearRange(fromYear, toYear, "team-stats.json").then((rows) => {
      const forTeam = [];
      rows.forEach(({ year, data }) => {
        const row = (data || []).find((r) => String(r.teamId) === String(teamId));
        if (row) forTeam.push({ year, row });
      });
      forTeam.sort((a, b) => b.year - a.year);

      if (!forTeam.length && !prepend) {
        tableWrap.innerHTML = "";
        tableWrap.appendChild(el("div", { class: "state-msg", text: "No seasons on file for this team in this range." }));
        return;
      }

      let table = tableWrap.querySelector("table");
      if (!table) {
        tableWrap.innerHTML = "";
        table = el("table", { class: "stat-table" });
        table.appendChild(el("thead", {}, [
          el("tr", {}, ["Year", "Division", "W", "L", "PCT"].map((h) => el("th", { text: h }))),
        ]));
        table.appendChild(el("tbody"));
        tableWrap.appendChild(table);
      }
      const tbody = table.querySelector("tbody");

      forTeam.forEach(({ year, row }) => {
        const w = pick(row, ["wins", "w"]);
        const l = pick(row, ["losses", "l"]);
        const pct = pick(row, ["winningPercentage", "pct", "winPct"]);
        const division = pick(row, ["divisionAtTheTime"], "—");
        const tr = el("tr", {}, [
          el("td", {}, [el("a", { class: "link", href: `scores.html?team=${teamId}&year=${year}`, text: String(year) })]),
          el("td", { text: division || "—" }),
          el("td", { text: w != null ? String(w) : "—" }),
          el("td", { text: l != null ? String(l) : "—" }),
          el("td", { text: pct != null ? Number(pct).toFixed(3) : "—" }),
        ]);
        tbody.appendChild(tr);
      });
    });
  }
</script>
</body>
</html>
